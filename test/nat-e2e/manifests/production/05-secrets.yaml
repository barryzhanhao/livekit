# Secrets for NAT-mode LiveKit deployment.
#
# IMPORTANT: Replace the placeholder values with your own generated secrets
# before applying. See the deploy guide for how to generate them.
#
# Generate a relay secret:
#   openssl rand -hex 32 | tee relay-secret.txt
# Then base64-encode it:
#   echo -n '<your-secret>' | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-relay-secret
  namespace: livekit-nat
  labels:
    app.kubernetes.io/name: livekit
type: Opaque
data:
  # Base64-encoded shared secret for media relay authentication.
  # ALL pods (edge and room) must use the same secret.
  # Replace with: echo -n '<your-64-char-hex>' | base64
  secret: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-keys
  namespace: livekit-nat
  labels:
    app.kubernetes.io/name: livekit
type: Opaque
data:
  # Base64-encoded JSON map of API keys.
  # Replace with: echo -n '{"devkey": "<your-api-key>"}' | base64
  keys: ""