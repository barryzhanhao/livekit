# Room Deployment — terminates SFU/Participant/TransportManager for WebRTC sessions.
# In NAT mode, room nodes do NOT hold real pion PeerConnections. Instead they hold
# remotePeerConnection proxies that forward SDP/ICE/state operations to the edge
# node over the control channel (7884). Plaintext RTP/RTCP arrives over the
# media relay TCP (7883) instead of direct UDP from clients.
#
# The room Deployment does NOT use hostNetwork because it only needs pod-to-pod
# TCP to the edge nodes (media relay + control) and outgoing Redis connectivity.
# No client-facing UDP ports are required on the host.
#
# Use nodeSelector or affinity to restrict to room-labeled nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-room
  namespace: livekit-nat
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/component: room
    app.kubernetes.io/version: "1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: livekit
      component: room
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # zero-downtime: wait for new pod Ready before killing old
  template:
    metadata:
      labels:
        app: livekit
        component: room
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7880"
        prometheus.io/scheme: "http"
    spec:
      # No hostNetwork — room nodes only need pod-to-pod TCP relay + clientless
      # Redis. Cluster DNS is sufficient for service discovery.
      terminationGracePeriodSeconds: 60  # graceful drain: allow ongoing sessions to migrate

      nodeSelector:
        nat-role: room        # only schedule on room-labeled nodes

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: livekit
                    component: room
                topologyKey: kubernetes.io/hostname

      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          imagePullPolicy: Always
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: media-relay
              containerPort: 7883
              protocol: TCP
            - name: control
              containerPort: 7884
              protocol: TCP
            - name: metrics
              containerPort: 7880
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LIVEKIT_NODE_ID
              value: "room-$(POD_IP)"
            # Room nodes do NOT set LIVEKIT_RTC_ADVERTISE_IP — they don't
            # terminate client-facing media. The edge nodes handle that.
            - name: LIVEKIT_RTC_MEDIA_RELAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-relay-secret
                  key: secret
                  optional: true
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-keys
                  key: keys
                  optional: true
            - name: LIVEKIT_REGION
              value: "default"
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 7880
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 7880
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 7880
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: config
          configMap:
            name: livekit-config
