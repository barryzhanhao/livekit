# LiveKit NAT multi-node E2E — base server config (identical on both nodes;
# per-pod differences are injected via LIVEKIT_* env overrides in the pod spec).
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882            # fixed external media port (NAT: advertise_ip:7882)
  use_external_ip: false    # advertise_ip drives ICE via 1:1 NAT rewrite instead
  node_ip: ""               # omitted: POD_IP env (hostNetwork -> node IP) is used
  advertise_ip: ""          # set per pod via LIVEKIT_RTC_ADVERTISE_IP
  stun_servers: []          # LAN test: no STUN/TURN; client reaches node IP directly
  media_relay:
    enabled: true            # NAT mode is opt-in (default false)
    port: 7883              # internal plaintext RTP/RTCP (pod-to-pod)
    control_port: 7884      # internal pion-PC control (pod-to-pod)
    secret: nat-e2e-relay-secret   # shared cross-node auth (P0-1); FAIL-CLOSED: empty secret rejects all inbound
  # Relay-drop recovery: when an edge↔room per-track media relay drops while the
  # participant is otherwise alive, force a full reconnect so the track is
  # re-established instead of freezing silently. Off by default in LiveKit; NAT
  # mode opts in because the extra network hop makes relay drops more impactful.
  reconnect_on_publication_error: true
  reconnect_on_subscription_error: true
keys:
  devkey: secret            # standard LiveKit dev credentials (lk --dev-compatible)
webhook:
  urls:
    - http://webhook-receiver.default.svc:8080/webhook
  api_key: devkey            # signing key: the receiver verifies the JWT sha256 claim
redis:
  # Sentinel HA: LiveKit connects via the 3 sentinels; the go-redis failover
  # client follows the promoted master on failover. Each redis pod runs a sentinel
  # sidecar (master name `livekit`, quorum 2). Password matches the redis
  # requirepass/masterauth in manifests/redis.yaml (shared literal).
  sentinel_master_name: livekit
  sentinel_addresses:
    - redis-0.redis-headless.default.svc:26379
    - redis-1.redis-headless.default.svc:26379
    - redis-2.redis-headless.default.svc:26379
  password: nat-e2e-redis-secret
# The edge↔room signal stream is PSRPC via redis. During a redis master failover
# (~10s: 5s down-after + promotion + client reconnect), sends fail. The default
# retry_timeout (7.5s) makes the signal sink give up and CLOSE the stream
# mid-failover -> the room tears down the participant's session -> media stops.
# Buffer through the failover so an established call survives a redis master
# change. Real outages longer than this DO disrupt sessions (clients reconnect).
signal_relay:
  retry_timeout: 30s
logging:
  level: debug              # debug for NAT flow logging anchors
  component_levels:         # suppress the SDP/trickle dumps that bloat kubectl logs
    livekit.transport: info
    livekit.pub: info
    livekit.ice: info
    livekit.sdp: info
room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 300
# Bound the N² subscription fan-out at large scale: 1000 clients auto-subscribing
# to all ~999 others = ~1M downlink track instances, which OOMs both the client
# pods and the room node. Production LiveKit limits subscriptions per participant
# (active-speaker style). The stress client still receives media (≥1 track), so
# media verification holds while the room stays within capacity. The 1000-client
# stress run caps fan-out aggressively: at 10 video + 4 audio per client the room
# builds ~14,000 downlink instances and saturates its CPU (join latency 12-15s,
# DTLS timeouts on the connection burst). video=2/audio=1 keeps ≥1 track flowing
# per client (media gate: 2048 bytes) while cutting the downlink count ~4.7x.
limit:
  subscription_limit_video: 2
  subscription_limit_audio: 1
turn:
  enabled: true            # in-process TURN: exercise iceServersForParticipant +
  udp_port: 3478           # TURN credential issuance in the join response
  # One relayed port per concurrent TURN allocation; 1000-client stress needs a
  # wide range (old 50000-50100 = 100 ports → 508 Insufficient Capacity at ~100).
  relay_range_start: 50000
  relay_range_end: 51100
  # The TURN permission policy denies private-peer IPs by default (loopback,
  # link-local, multicast, RFC1918). The edge's host candidates are private kind
  # IPs (192.168.107.x), so a relay-ONLY ICE connection — the relayed socket's
  # STUN checks to the edge host candidate — can only complete if these ranges
  # are allowed. Real networks advertise PUBLIC host candidates and need no
  # allow-list (this is exactly why relay-only "needs real-network verification"
  # upstream: it is a deployment config, not a server bug).
  allow_restricted_peer_cidrs:
    - 192.168.0.0/16        # kind node network
    - 10.0.0.0/8            # pod CIDR
    - 172.16.0.0/12         # service CIDR
