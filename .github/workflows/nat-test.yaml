# NAT Test — fast build + vet + unit-test regression for the NAT multi-node fork.
#
# Covers the NAT-modified packages (remote transport / media relay / participant /
# prometheus NAT metrics / test client). The FULL `go test -race ./...` suite is
# already run by the upstream `buildtest.yaml` — extend that workflow's `push`
# branches to `nat-mode-redesign` if you want it on every NAT-branch push.
#
# Pin the action SHAs (replace the `# vN` tags with the commit SHAs, matching the
# upstream buildtest.yaml convention) before enabling on the repo.

name: NAT Test

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [master, nat-mode-redesign]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Some rtc/transport tests touch redis-backed routing helpers.
      - uses: shogo82148/actions-setup-redis@2f3253b148c73d7a0682eae73e862b777a4fa74e # v1
        with:
          redis-version: "6.x"
          auto-start: true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "^1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./pkg/rtc/... ./pkg/sfu/... ./pkg/service/... ./pkg/telemetry/prometheus/... ./test/client/... ./test/nat-e2e/...

      - name: Unit tests (NAT packages)
        # transport: relay channel framing/auth, CloseReason (relay-drop vs
        #   teardown), relay benchmarks
        # client:    RTP loss tracker
        # prometheus: NAT metric registration
        run: |
          go test -race -count=1 ./pkg/rtc/transport/ ./test/client/ ./pkg/telemetry/prometheus/
